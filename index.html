  <!-- ===== 手机端访问门槛（2026-10）=====
       必须在**主 bundle 之前**生效：bundle 有 1.3MB，等它跑起来再遮罩，手机用户已经先看到
       一眼错乱的手机布局（styles.css 在构建产物里是 <link>，首屏就生效而 JS 还没跑）。
       故这里的样式与判定是**内联**的（同步执行、早于首次绘制）；其中可变的口径
       （UA 正则源码 / 存储键 / 桌面 viewport / class 名 / 两句文案）在
       src/mobileGate.ts 与 messages.json 里各有一份**被单测逐字比对**的副本
       （见 src/mobileGate.test.ts），所以"改了实现忘了改这里"不会静默上线。

       ⚠ **刻意不放静态的 viewport meta**，改由下面的内联脚本**创建唯一的那一个**
       （在 `<head>` 最前面、任何内容之前）。原因是一个真实缺陷：
       原先的做法是"先声明 `width=device-width`，再在脚本里改成 `width=1280`"。
       百度 App 内置浏览器（Android，Chromium 97）在脚本执行前就已按 `device-width` 排版并
       **合成了那些带圆角/阴影的浮动控件图层**（`#zoom-pill` / `#btn-help` / `#hkmac-inset`）；
       视口改成 1280 触发重新排版后，旧图层没有被失效，于是在旧的左上角位置留下残影、
       新位置在左下角 —— 用户看到的是"按钮重复且位置不对"。
       （现代 Chromium 会正确失效，所以本地/新版 Edge 复现不出来。）
       现在全程**只声明一次 viewport、之后永不修改**，那个重排与残留从根上不存在。
       `src/mobileGate.test.ts` 有两条断言守着这一点（不得出现静态 meta、不得二次修改）。

       判定与行为：
         · 明显爬虫（含 Googlebot-Smartphone）不弹 —— 手机 UA 与爬虫无法区分，而 SEO 要抓正文；
         · 手机（UA 像手机 且 有触屏/粗指针）：按**电脑 viewport**（width=1280）排版一次到位，
           弹出「请用电脑端访问」；点「继续访问」记下选择并放行，下次访问不再打扰；
         · 桌面浏览器：viewport 仍是 device-width，什么都不做。 -->
  <style>
    html.mobile-gate #app { visibility: hidden; }
    #mobile-gate {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      padding: 24px;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.92);
      font-family: system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      color: #f8fafc;
    }
    html.mobile-gate #mobile-gate { display: flex; }
    #mobile-gate .mobile-gate-card {
      width: min(360px, 100%);
      padding: 28px 22px;
      border: 1px solid rgba(248, 250, 252, 0.18);
      border-radius: 14px;
      background: rgba(30, 41, 59, 0.96);
      text-align: center;
    }
    #mobile-gate .mobile-gate-title { margin: 0 0 6px; font-size: 17px; font-weight: 700; }
    #mobile-gate .mobile-gate-note { margin: 0 0 20px; font-size: 12px; line-height: 1.6; color: #cbd5e1; }
    #mobile-gate button {
      width: 100%;
      padding: 11px 16px;
      border: 0;
      border-radius: 10px;
      background: #10b981;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
  <script>
    (function () {
      var PHONE_UA = new RegExp('Android|iPhone|iPod|Windows Phone|HarmonyOS|MiuiBrowser|MicroMessenger|Weixin|Mobile Safari', 'i');
      var CRAWLER_UA = new RegExp('bot|spider|crawler|slurp|headless|externalagent', 'i');
      var KEY = 'china-admin-mobile-gate-v1';
      var DESKTOP_VIEWPORT = 'width=1280';
      var GATE_CLASS = 'mobile-gate';
      var ua = navigator.userAgent || '';
      // 爬虫不弹（Googlebot-Smartphone 与普通手机 UA 无法区分，而 SEO 要抓正文）
      var crawler = CRAWLER_UA.test(ua);
      var phone = false;
      if (!crawler && PHONE_UA.test(ua)) {
        var coarse = false;
        try { coarse = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches); } catch (e) {}
        phone = navigator.maxTouchPoints > 0 || coarse;
      }

      // ★ 唯一一次声明 viewport：在**任何内容之前**按判定结果创建它，之后**永不修改**。
      //   手机 → width=1280（电脑视图，一次到位）；其余（桌面/爬虫/无 JS）→ device-width。
      //   为什么不能"先 device-width 再改"：见上面注释里的真实缺陷（百度 App 旧内核留下
      //   浮动控件残影，表现为"按钮重复且位置不对"）。
      var meta = document.createElement('meta');
      meta.id = 'viewport-meta';
      meta.name = 'viewport';
      meta.setAttribute('content', phone ? DESKTOP_VIEWPORT : 'width=device-width, initial-scale=1.0');
      (document.head || document.documentElement).appendChild(meta);

      if (!phone) return;

      var stored = null;
      try { stored = localStorage.getItem(KEY); } catch (e) {}
      if (stored === 'continue') return; // 已经选过"继续访问"：不再打扰

      document.documentElement.classList.add(GATE_CLASS);
      // ⚠ 用**即时挂上的事件委托**，不要挂 DOMContentLoaded。
      //   实测（生产）：慢网下主 bundle（1.3MB，type=module 延迟执行）会把 DOMContentLoaded
      //   推到 bundle 执行完之后，而遮罩与按钮在那之前就已经可见可点了 ——
      //   挂在 DOMContentLoaded 上的处理器此时**还不存在**，用户早点一下按钮毫无反应。
      //   委托挂在 document 上（捕获阶段，别人 stopPropagation 也拦不掉），
      //   从遮罩出现的第一刻起就可用。
      document.addEventListener(
        'click',
        function (event) {
          var t = event.target;
          if (!t || !t.closest || !t.closest('#mobile-gate-continue')) return;
          try { localStorage.setItem(KEY, 'continue'); } catch (e) {}
          document.documentElement.classList.remove(GATE_CLASS);
        },
        true,
      );
    })();
  </script>

      <div id="top-status">
        <div id="top-hint" class="hidden"></div>
        <div id="endless-status" class="hidden"></div>
        <!-- 拼图模式顶部进度行：已拼 n/34 ｜ 用时 mm:ss -->
        <div id="puzzle-status" class="hidden" aria-live="polite"></div>
        <div id="test-timer" class="hidden" aria-live="polite">0.00s</div>
      </div>
      <div id="mode-hint" class="hidden"></div>
      <div id="pause-overlay" class="hidden" aria-live="polite"><span>点击任意处继续</span></div>
      <div id="hover-stats" class="hidden" aria-live="polite"></div>
      <div id="mode-info">
        <button id="btn-mode-settings" class="mode-action hidden">设置</button>
        <div id="mode-info-row">
          <button id="btn-help" class="mode-action">说明</button>
          <div id="zoom-pill">1.00x</div>
        </div>
      </div>
      <div id="endless-items" class="hidden"></div>
      <div id="endless-token" class="hidden"></div>
      <div id="endless-food" class="hidden"></div>
      <div id="map"></div>
      <!-- 拼图模式画布：进入该模式时 #map 隐藏、本层显示（与留言板/管理同一套做法） -->
      <div id="puzzle" class="hidden"></div>
      <div id="hkmac-inset" class="hidden"></div>
      <div id="board" class="hidden"></div>
      <div id="admin" class="hidden"></div>
      <aside id="side-panel">
        <button id="side-panel-toggle" class="side-panel-toggle" type="button" aria-controls="side-panel" aria-expanded="false" aria-label="展开或收起排行榜"></button>
        <div id="side-panel-content">
          <h3 id="side-panel-title">熟练度分析</h3>
          <div id="stats"></div>
          <div id="leaderboard" class="hidden"></div>
          <p id="side-panel-tip" class="tip">进度自动保存在本机浏览器（localStorage）</p>
        </div>
      </aside>
    </main>
  </div>

  <div id="summary" class="overlay hidden">
    <div class="card">
      <div id="summary-body"></div>
      <div class="card-actions">
        <button id="summary-submit" class="primary hidden" type="button">提交成绩</button>
        <button id="summary-restart" class="primary" type="button">再来一轮</button>
        <button id="summary-close" class="ghost" type="button">关闭</button>
      </div>
    </div>
  </div>

  <div id="settlement" class="overlay hidden">
    <div class="card">
      <div id="settlement-body"></div>
      <div class="card-actions">
        <button id="settlement-submit" class="primary" type="button">提交成绩</button>
        <button id="settlement-close" class="ghost" type="button">关闭</button>
      </div>
    </div>
  </div>

  <div id="help-panel" class="overlay hidden">
    <div class="card help-card">
      <h3 id="help-title">说明</h3>
      <div id="help-body"></div>
      <div class="card-actions">
        <button id="help-close" class="ghost">关闭</button>
      </div>
    </div>
  </div>

  <div id="level-end" class="overlay hidden">
    <div class="card">
      <div id="level-end-body"></div>
      <div class="card-actions">
        <button id="level-end-continue" class="primary">继续</button>
      </div>
    </div>
  </div>

  <div id="auth-panel" class="overlay hidden">
    <div id="auth-card" class="card auth-card"></div>
  </div>

  <div id="announcement-panel" class="overlay hidden"></div>

  <div id="intro-card" class="overlay hidden"></div>

  <div id="settings-panel" class="overlay hidden">
    <div class="card">
      <h3>设置</h3>
      <div class="settings-section-title">个性化</div>
      <label class="row setting-row"><span class="row-label">地级市边界</span>
        <select id="set-city-boundary-tone">
          <option value="light">浅灰色</option>
          <option value="mid">灰色</option>
          <option value="dark">深灰色</option>
        </select>
      </label>
      <label class="row setting-row"><span class="row-label">省级边界</span>
        <select id="set-province-boundary-tone">
          <option value="light">浅灰色</option>
          <option value="mid">灰色</option>
          <option value="dark">深灰色</option>
        </select>
      </label>
      <label class="row setting-row"><span class="row-label">世界边界</span>
        <select id="set-world-boundary-tone">
          <option value="light">浅灰色</option>
          <option value="mid">灰色</option>
          <option value="dark">深灰色</option>
        </select>
      </label>
      <div class="settings-section-title">答题范围</div>
      <label class="row setting-row"><span class="row-label">忽略面积极小的国家<span class="row-hint" id="set-ignore-tiny-hint"></span></span><input type="checkbox" id="set-ignore-tiny" /></label>
      <div class="settings-section-title">地图下钻</div>
      <label class="row setting-row"><span class="row-label">下钻后隐藏无关地区</span><input type="checkbox" id="set-hide-unrelated-drill" /></label>
      <div class="settings-section-title">地图标签</div>
      <label class="row setting-row"><span class="row-label">未开始时显示地图标签<span class="row-hint">点击 / 输入 / 无尽闯关在「未开始」的浏览阶段显示全部地名，开始答题后自动隐藏，结束后恢复</span></span><input type="checkbox" id="set-show-browse-labels" /></label>
      <div class="card-actions">
        <button id="set-save" class="primary">保存</button>
        <button id="set-cancel" class="ghost">取消</button>
      </div>
    </div>
  </div>

  <div id="mode-settings-panel" class="overlay hidden"></div>

  <div id="endless-shop" class="overlay hidden">
    <div class="card endless-shop-card">
      <div id="endless-shop-body"></div>
      <div class="card-actions">
        <button id="endless-shop-continue" class="primary">继续</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
