<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>中国行政区记忆</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">中国行政区记忆</div>
      <nav id="mode-tabs">
        <button data-mode="free" class="active">自由模式</button>
        <button data-mode="self">自测模式</button>
        <button data-mode="challenge">挑战模式</button>
        <button data-mode="memory">记忆模式</button>
      </nav>
      <div class="top-actions">
        <button id="btn-stats" class="ghost">进度</button>
        <button id="btn-settings" class="ghost">设置</button>
      </div>
    </header>

    <div id="mode-progress" class="hidden"></div>

    <main>
      <div id="mode-actions">
        <button id="btn-skip" class="mode-action">跳过</button>
        <button id="btn-end" class="mode-action danger-hover">结束</button>
        <button id="btn-reset" class="mode-action">重置</button>
      </div>
      <div id="search-row">
        <input id="search-input" type="text" placeholder="输入地名，如：黔南" autocomplete="off" spellcheck="false" />
        <button id="btn-search" class="mode-action search-confirm" type="button">确认</button>
        <div id="timer-pill" class="hidden">10s</div>
      </div>
      <div id="mode-hint"></div>
      <div id="mode-info">
        <button id="btn-help" class="mode-action">说明</button>
        <div id="zoom-pill">1.00x</div>
      </div>
      <div id="map"></div>
      <aside id="side-panel">
        <h3>自由模式进度</h3>
        <div id="stats"></div>
        <p class="tip">进度自动保存在本机浏览器（localStorage）</p>
      </aside>
    </main>
  </div>

  <div id="summary" class="overlay hidden">
    <div class="card">
      <div id="summary-body"></div>
      <div class="card-actions">
        <button id="summary-restart" class="primary">再来一轮</button>
        <button id="summary-close" class="ghost">关闭</button>
      </div>
    </div>
  </div>

  <div id="help-panel" class="overlay hidden">
    <div class="card help-card">
      <h3 id="help-title">说明</h3>
      <div id="help-body"></div>
      <div class="card-actions">
        <button id="help-close" class="ghost">关闭</button>
      </div>
    </div>
  </div>

  <div id="settings-panel" class="overlay hidden">
    <div class="card">
      <h3>设置</h3>
      <label class="row"><input type="checkbox" id="set-self-enable" /> 自测模式开启倒计时</label>
      <label class="row"><input type="checkbox" id="set-require-enter" /> 按下 Enter 确认</label>
      <label class="row"><input type="checkbox" id="set-auto-follow" /> 自动跟随</label>
      <label class="row"><input type="checkbox" id="set-dark-mode" /> 黑夜模式</label>
      <label class="row">自测每题秒数 <input type="number" id="set-self-secs" min="5" max="600" style="width:80px" /></label>
      <label class="row">自动跟随倍率 <input type="number" id="set-follow-zoom" min="2" max="28" step="0.5" style="width:80px" /></label>
      <label class="row">挑战模式每题秒数 <input type="number" id="set-challenge-secs" min="3" max="120" style="width:80px" /></label>
      <div class="card-actions">
        <button id="set-save" class="primary">保存</button>
        <button id="set-cancel" class="ghost">取消</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
