<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ===== SEO：标题与描述 =====
       百度对标题前段权重更高，故关键词「地图记忆」在前、「中国行政区」在后；
       本站有两套题库（373 个中国地级单位 / 194 个国家），故标题与描述同时覆盖两类搜索意图。
       注意：站点自定位为「助手/记忆/练习」，刻意不自称「游戏」——
       免费浏览器游戏在《网络出版服务管理规定》第二十七条下可能被认定为需版号的
       「网络游戏」（2009 年通知的适用范围明文含「网页游戏、休闲游戏」且无商业门槛），
       详见 docs/adr/0004。 -->
  <title>地图记忆 - 中国行政区和世界国家记忆助手</title>
  <meta name="description" content="地图记忆：免费的中国行政区与世界国家地图记忆助记工具。覆盖 34 个省级行政区、373 个地级行政区与 194 个国家，支持输入、点击、闯关、熟练度分析等多种记忆练习方式，帮助快速记住中国省市与世界各国在地图上的位置。" />
  <meta name="keywords" content="地图记忆,中国行政区,中国地图记忆,省份记忆,地级市记忆,中国省份,世界国家,世界地图记忆,地理记忆,行政区划" />
  <meta name="author" content="地图记忆" />
  <meta name="robots" content="index,follow" />
  <meta name="theme-color" content="#1f2937" />
  <link rel="canonical" href="https://mapmemory.cn/" />

  <!-- Open Graph / Twitter：分享到社交平台时的标题与摘要 -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="地图记忆" />
  <meta property="og:locale" content="zh_CN" />
  <meta property="og:title" content="地图记忆 - 中国行政区和世界国家记忆助手" />
  <meta property="og:description" content="免费的中国行政区与世界国家地图记忆助记工具：34 个省级行政区、373 个地级行政区、194 个国家，多种记忆练习方式。" />
  <meta property="og:url" content="https://mapmemory.cn/" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="地图记忆 - 中国行政区和世界国家记忆助手" />
  <meta name="twitter:description" content="免费的中国行政区与世界国家地图记忆助记工具。" />

  <!-- 结构化数据：告诉搜索引擎这是个免费的中文教育类 Web 应用 -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "地图记忆",
      "alternateName": "中国行政区与世界国家地图记忆助手",
      "url": "https://mapmemory.cn/",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Web",
      "inLanguage": "zh-CN",
      "description": "免费的中国行政区与世界国家地图记忆助记工具，覆盖 34 个省级行政区、373 个地级行政区与 194 个国家。",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "CNY" },
      "about": [
        { "@type": "Thing", "name": "中国行政区划" },
        { "@type": "Thing", "name": "世界国家地理" }
      ]
    }
  </script>
</head>
<body>
  <div id="app">
    <!-- 静态可爬文本：搜索蜘蛛（尤其百度）不执行 JS，这段是站点唯一稳定的语义信号。
         它同时是视觉上的品牌名与站点简介，不是隐藏文本。 -->
    <noscript>
      <div class="noscript-intro">
        <p>「地图记忆」是一个免费的中国行政区与世界国家地图记忆助记工具，帮助你在地图上记住中国省市与世界各国。</p>
        <ul>
          <li><strong>中国行政区</strong>：34 个省级行政区、373 个地级行政区（含自治州、地区、盟，以及北京/上海/天津/重庆/香港/澳门/台湾）。</li>
          <li><strong>世界国家</strong>：194 个答题国家，可按亚洲、欧洲、非洲、北美洲、南美洲、大洋洲逐层下钻，并进一步按东亚、东南亚、南亚、西亚、中亚等次区域练习。</li>
          <li><strong>练习方式</strong>：输入模式（键盘作答）、点击模式（地图上点选）、无尽闯关（限时收集）、熟练度分析（按掌握程度分层着色）。</li>
          <li><strong>目录</strong>：<a href="/china/">中国各省</a> · <a href="/world/">世界各大洲</a></li>
        </ul>
        <p>本站需要启用 JavaScript 才能使用交互地图。</p>
      </div>
    </noscript>
    <header class="topbar">
      <h1 class="brand">地图记忆</h1>
      <nav id="mode-tabs">
        <button data-mode="click" class="active">点击模式</button>
        <button data-mode="self">输入模式</button>
        <button data-mode="endless">无尽闯关</button>
        <button data-mode="memory">自由模式</button>
      </nav>
      <div class="top-actions">
        <button id="btn-free" class="ghost">熟练度分析</button>
        <button id="btn-board" class="ghost">留言板</button>
        <button id="btn-announcement" class="ghost">公告</button>
        <button id="btn-settings" class="ghost">设置</button>
        <div class="user-center-wrap">
          <button id="user-center" class="user-center" type="button" aria-haspopup="menu" aria-expanded="false"></button>
          <div id="user-menu" class="user-menu hidden" role="menu"></div>
        </div>
      </div>
    </header>

    <div id="mode-progress" class="hidden"></div>

    <main>
      <div id="mode-actions">
        <div id="granularity-toggle" class="mode-segmented hidden" role="radiogroup" aria-label="测试粒度">
          <button id="granularity-world" type="button" data-granularity="world" role="radio" aria-checked="false">世界</button>
          <button id="granularity-province" type="button" data-granularity="province" role="radio" aria-checked="false">省级</button>
          <button id="granularity-city" type="button" data-granularity="city" role="radio" aria-checked="false">市级</button>
        </div>
        <div id="self-order-toggle" class="mode-segmented hidden" role="radiogroup" aria-label="输入模式出题顺序">
          <button id="self-order-sequential" type="button" class="active" data-order="sequential" role="radio" aria-checked="true">顺序</button>
          <button id="self-order-random" type="button" data-order="random" role="radio" aria-checked="false">随机</button>
          <button id="self-order-wrong" type="button" data-order="wrong" role="radio" aria-checked="false">错题</button>
        </div>
        <div id="click-order-toggle" class="mode-segmented hidden" role="radiogroup" aria-label="点击模式出题顺序">
          <button id="click-order-random" type="button" class="active" data-order="random" role="radio" aria-checked="true">随机</button>
          <button id="click-order-wrong" type="button" data-order="wrong" role="radio" aria-checked="false">错题</button>
        </div>
        <div id="analysis-granularity-toggle" class="mode-segmented hidden" role="radiogroup" aria-label="熟练度分析粒度">
          <button id="analysis-granularity-world" type="button" data-analysis-granularity="world" role="radio" aria-checked="false">世界</button>
          <button id="analysis-granularity-province" type="button" data-analysis-granularity="province" role="radio" aria-checked="false">省级</button>
          <button id="analysis-granularity-city" type="button" class="active" data-analysis-granularity="city" role="radio" aria-checked="true">地级</button>
        </div>
        <button id="btn-skip" class="mode-action">跳过</button>
        <button id="btn-end" class="mode-action danger-hover">暂停</button>
        <button id="btn-reset" class="mode-action">重置</button>
        <!-- 换行占位：把洲范围按钮推到下一行，同时保持其自身为内容宽度（不占满屏）。
             放在末尾是为了让「世界/省级/市级」与「顺序/重置」留在同一行。 -->
        <div id="continent-break" class="flex-break" aria-hidden="true"></div>
        <div id="continent-toggle" class="mode-segmented hidden" role="radiogroup" aria-label="世界大洲范围">
          <button id="continent-all" type="button" class="active" data-continent="" role="radio" aria-checked="true">全世界</button>
          <button id="continent-AS" type="button" data-continent="AS" role="radio" aria-checked="false">亚洲</button>
          <button id="continent-EU" type="button" data-continent="EU" role="radio" aria-checked="false">欧洲</button>
          <button id="continent-AF" type="button" data-continent="AF" role="radio" aria-checked="false">非洲</button>
          <button id="continent-NA" type="button" data-continent="NA" role="radio" aria-checked="false">北美</button>
          <button id="continent-SA" type="button" data-continent="SA" role="radio" aria-checked="false">南美</button>
          <button id="continent-OC" type="button" data-continent="OC" role="radio" aria-checked="false">大洋洲</button>
        </div>
        <!-- 次区域行：仅当已选大洲且该大洲分区数 > 1 时显示（南美只有 1 个分区，不给此行）。
             与 #continent-break 同一机制：独占一行、宽度取内容。 -->
        <div id="subregion-break" class="flex-break hidden" aria-hidden="true"></div>
        <div id="subregion-toggle" class="mode-segmented hidden" role="radiogroup" aria-label="大洲内次区域范围"></div>
      </div>
      <div id="search-row">
        <input id="search-input" type="text" placeholder="输入地名" autocomplete="off" spellcheck="false" />
      </div>
      <div id="top-status">
        <div id="top-hint" class="hidden"></div>
        <div id="endless-status" class="hidden"></div>
        <div id="test-timer" class="hidden" aria-live="polite">0.00s</div>
      </div>
      <div id="mode-hint" class="hidden"></div>
      <div id="pause-overlay" class="hidden" aria-live="polite"><span>点击任意处继续</span></div>
      <div id="hover-stats" class="hidden" aria-live="polite"></div>
      <div id="mode-info">
        <button id="btn-mode-settings" class="mode-action hidden">设置</button>
        <div id="mode-info-row">
          <button id="btn-help" class="mode-action">说明</button>
          <div id="zoom-pill">1.00x</div>
        </div>
      </div>
      <div id="endless-items" class="hidden"></div>
      <div id="endless-token" class="hidden"></div>
      <div id="endless-food" class="hidden"></div>
      <div id="map"></div>
      <div id="hkmac-inset" class="hidden"></div>
      <div id="board" class="hidden"></div>
      <div id="admin" class="hidden"></div>
      <aside id="side-panel">
        <button id="side-panel-toggle" class="side-panel-toggle" type="button" aria-controls="side-panel" aria-expanded="false" aria-label="展开或收起排行榜"></button>
        <div id="side-panel-content">
          <h3 id="side-panel-title">熟练度分析</h3>
          <div id="stats"></div>
          <div id="leaderboard" class="hidden"></div>
          <p id="side-panel-tip" class="tip">进度自动保存在本机浏览器（localStorage）</p>
        </div>
      </aside>
    </main>
  </div>

  <div id="summary" class="overlay hidden">
    <div class="card">
      <div id="summary-body"></div>
      <div class="card-actions">
        <button id="summary-submit" class="primary hidden" type="button">提交成绩</button>
        <button id="summary-restart" class="primary" type="button">再来一轮</button>
        <button id="summary-close" class="ghost" type="button">关闭</button>
      </div>
    </div>
  </div>

  <div id="settlement" class="overlay hidden">
    <div class="card">
      <div id="settlement-body"></div>
      <div class="card-actions">
        <button id="settlement-submit" class="primary" type="button">提交成绩</button>
        <button id="settlement-close" class="ghost" type="button">关闭</button>
      </div>
    </div>
  </div>

  <div id="help-panel" class="overlay hidden">
    <div class="card help-card">
      <h3 id="help-title">说明</h3>
      <div id="help-body"></div>
      <div class="card-actions">
        <button id="help-close" class="ghost">关闭</button>
      </div>
    </div>
  </div>

  <div id="level-end" class="overlay hidden">
    <div class="card">
      <div id="level-end-body"></div>
      <div class="card-actions">
        <button id="level-end-continue" class="primary">继续</button>
      </div>
    </div>
  </div>

  <div id="auth-panel" class="overlay hidden">
    <div id="auth-card" class="card auth-card"></div>
  </div>

  <div id="announcement-panel" class="overlay hidden"></div>

  <div id="intro-card" class="overlay hidden"></div>

  <div id="settings-panel" class="overlay hidden">
    <div class="card">
      <h3>设置</h3>
      <div class="settings-section-title">个性化</div>
      <label class="row"><input type="checkbox" id="set-dark-mode" /> 黑夜模式</label>
      <label class="row">地级市边界
        <select id="set-city-boundary-tone">
          <option value="light">浅灰色</option>
          <option value="mid">灰色</option>
          <option value="dark">深灰色</option>
        </select>
      </label>
      <label class="row">省级边界
        <select id="set-province-boundary-tone">
          <option value="light">浅灰色</option>
          <option value="mid">灰色</option>
          <option value="dark">深灰色</option>
        </select>
      </label>
      <div class="settings-section-title">答题范围</div>
      <label class="row"><input type="checkbox" id="set-ignore-tiny" /> 忽略面积极小的国家<span class="row-hint" id="set-ignore-tiny-hint"></span></label>
      <div class="card-actions">
        <button id="set-save" class="primary">保存</button>
        <button id="set-cancel" class="ghost">取消</button>
      </div>
    </div>
  </div>

  <div id="mode-settings-panel" class="overlay hidden"></div>

  <div id="endless-shop" class="overlay hidden">
    <div class="card endless-shop-card">
      <div id="endless-shop-body"></div>
      <div class="card-actions">
        <button id="endless-shop-continue" class="primary">继续</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
